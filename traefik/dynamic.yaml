http:
  routers:
    # El feed del outbox existe solamente en el puerto interno 8080.
    outbox-internal:
      entryPoints: [internal]
      rule: "PathPrefix(`/api/reportes/internal`)"
      service: reportes
      priority: 100
    alertas:
      entryPoints: [web]
      rule: "PathPrefix(`/api/alertas`)"
      service: alertas
      priority: 50
    identidad:
      entryPoints: [web]
      rule: "PathPrefix(`/api/usuarios`)"
      service: identidad
      priority: 40
    reportes-publicos:
      entryPoints: [web]
      rule: "PathPrefix(`/`) && !PathPrefix(`/api/reportes/internal`)"
      service: reportes
      priority: 1

  services:
    reportes:
      loadBalancer:
        healthCheck:
          path: /health/ready
          interval: 2s
          timeout: 1s
        servers:
          - url: http://reportes_a:8000
          - url: http://reportes_b:8000
    alertas:
      loadBalancer:
        healthCheck:
          path: /health/ready
          interval: 2s
          timeout: 1s
        servers:
          - url: http://alertas:8001
    identidad:
      loadBalancer:
        healthCheck:
          path: /health/ready
          interval: 2s
          timeout: 1s
        servers:
          - url: http://identidad:8002
