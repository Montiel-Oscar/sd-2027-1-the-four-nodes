[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-four-nodes"
version = "0.1.0"
description = "Monolito inicial para la búsqueda comunitaria de mascotas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.4",
  "psycopg[binary]==3.3.6",
  "httpx>=0.27,<1",
  "PyJWT>=2.14,<3",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app/web/tests"]
